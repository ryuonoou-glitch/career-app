name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify Flutter project
        run: |
          echo "Current directory:"
          pwd
          echo "Checking Flutter project:"
          ls -la

          if [ -f "pubspec.yaml" ]; then
            echo "pubspec.yaml FOUND"
          else
            echo "ERROR: pubspec.yaml NOT FOUND"
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS IPA
        run: flutter build ipa --release --no-codesign

      - name: Verify IPA
        run: |
          echo "Checking generated IPA..."
          ls -lh build/ios/ipa/

          IPA_FILE=$(find build/ios/ipa -name "*.ipa" -type f | head -n 1)

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No IPA file found"
            exit 1
          fi

          echo "IPA FOUND:"
          echo "$IPA_FILE"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CareerPath-iOS-IPA
          path: build/ios/ipa/*.ipa
