name: Build iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify Flutter project
        run: |
          echo "Current directory:"
          pwd
          echo "Checking Flutter project:"
          ls -la

          if [ -f "pubspec.yaml" ]; then
            echo "pubspec.yaml FOUND"
          else
            echo "ERROR: pubspec.yaml NOT FOUND"
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Verify iOS build
        run: |
          echo "Checking iOS build..."
          ls -lh build/ios/iphoneos/
          test -d build/ios/iphoneos/Runner.app
          echo "Runner.app FOUND"

      - name: Create ZIP
        run: |
          zip -r CareerPath-iOS.zip build/ios/iphoneos/Runner.app

      - name: Verify ZIP
        run: |
          echo "Checking ZIP..."
          ls -lh CareerPath-iOS.zip
          test -f CareerPath-iOS.zip
          echo "CareerPath-iOS.zip FOUND"

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: CareerPath-iOS
          path: CareerPath-iOS.zip
